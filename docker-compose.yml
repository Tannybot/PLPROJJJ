services:
  postgres:
    image: postgres:16-alpine
    container_name: plass-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: plass
      POSTGRES_USER: plass
      POSTGRES_PASSWORD: plass
    ports:
      - "5432:5432"
    volumes:
      - plass_pg:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    env_file: .env
    depends_on:
      - postgres
    ports:
      - "4000:4000"

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    env_file: .env
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  plass_pg:
